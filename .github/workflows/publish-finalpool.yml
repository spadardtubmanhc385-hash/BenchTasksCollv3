name: Publish finalpool
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy pinned implemented tasks
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python3 - <<'PY'
