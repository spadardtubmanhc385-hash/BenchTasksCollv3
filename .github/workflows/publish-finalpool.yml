              subprocess.run(['git','fetch','--depth=1','https://github.com/toolathlon/BenchTasksCollv3.git',heads[branch]],check=True)
              for name in names:
                  sourcepath = 'tasks/' + stem + '/' + name
                  archive = subprocess.check_output(['git','archive','--format=tar',heads[branch],sourcepath])
                  count=0
                  for item in tarfile.open(fileobj=io.BytesIO(archive),mode='r:'):
                      if item.isfile():
                          relative = item.name[len(sourcepath)+1:]
                          destination=pathlib.Path('tasks/finalpool')/name/relative
                          destination.parent.mkdir(parents=True,exist_ok=True)
                          with item as stream, destination.open('wb') as output:
                              output.write(stream.read())
                          count+=1
                  assert count>0,(name,sourcepath)
                  members.append({'name':name,'branch':branch,'source_path':sourcepath,'head':heads[branch],'status':'implemented','notion_id':ids[len(members)],'publication':'unchanged'})
          assert len(members)==48
          pathlib.Path('tasks/finalpool/MANIFEST.json').write_text(json.dumps({'base_repository':'toolathlon/BenchTasksCollv3','members':sorted(members,key=[REDACTED] item:item['name'])},indent=2)+'\n')
          subprocess.run(['git','add','tasks/finalpool'],check=True)
          check=subprocess.run(['git','diff','--cached','--check'],capture_output=True,text=True)
          if 'error:' in check.stdout:
              raise RuntimeError(check.stdout)
          print(check.stdout)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
